name: Docker Build and Deploy

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: self-hosted  # Changed from ubuntu-latest to self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Build and Deploy Locally
        shell: powershell
        run: |
          Write-Host "Starting deployment..."
          
          # Clean up any existing containers and images
          if (docker ps -a --format '{{.Names}}' | Select-String -Pattern '^react-chuck-norris$') {
              Write-Host "Removing existing container..."
              docker stop react-chuck-norris
              docker rm react-chuck-norris
          }
          if (docker images react-chuck-norris --format '{{.Repository}}' | Select-String -Pattern '^react-chuck-norris$') {
              Write-Host "Removing existing image..."
              docker rmi react-chuck-norris
          }
          
          # Build the image with detailed output
          Write-Host "Building Docker image..."
          docker build --no-cache --progress=plain -t react-chuck-norris -f Dockerfile.prod . 
          
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Docker build failed!"
              exit 1
          }
          
          # Run new container
          Write-Host "Starting new container..."
          docker run -d --name react-chuck-norris -p 3000:3000 react-chuck-norris:latest
          
          # Wait for container to start
          Start-Sleep -Seconds 5
          
          # Check container status
          $status = docker ps --filter "name=react-chuck-norris" --format "{{.Status}}"
          if ($status) {
              Write-Host "Container is running: $status"
              Write-Host "Application available at http://localhost:3000"
          } else {
              Write-Error "Container failed to start!"
              docker logs react-chuck-norris
              exit 1
          }